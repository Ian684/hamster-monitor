# 倉鼠監控設定檔 — 修改後重啟對應服務:
#   sudo systemctl restart hamster-climate   (溫濕度 / 風扇 / 顯示器)
#   sudo systemctl restart hamster-tracker   (相機追蹤)

[sensor]
interval_s = 5          # 每幾秒讀一次 DHT11 (DHT11 最快約 2 秒)
median_window = 5       # 取最近幾筆有效讀數的中位數，濾掉雜訊
stale_after_s = 60      # 超過幾秒沒有有效讀數就顯示錯誤
temp_offset = -2.0       # 校正：溫度計的讀數 - DHT11 的讀數（例如 DHT11 高 2 度就填 -2.0）
hum_offset = 0.0        # 校正：濕度計的讀數 - DHT11 的讀數

[fan]
gpio = 17
active_high = false     # 藍色繼電器是低電位觸發
temp_on = 27.0          # 溫度 >= 這個值就開風扇 (°C)
temp_off = 25.5         # 溫度 <= 這個值才可能關 (°C)
hum_on = 70             # 濕度 >= 這個值就開風扇 (%)
hum_off = 62            # 濕度 <= 這個值才可能關 (%)
min_switch_s = 30       # 兩次切換至少間隔幾秒，保護繼電器

[display]
brightness = 40         # 0~255

[log]
interval_s = 60         # 每幾秒寫一筆紀錄到資料庫
db = "data/hamster.db"
status_file = "data/status.json"

[web]
# 修改後執行: sudo systemctl restart hamster-web
host = "0.0.0.0"   # 只想在 Tailscale 上開放時，改成樹莓派的 Tailscale IP
port = 8000
# 只有這些裝置能開網頁（Tailscale IP，也可以寫網段如 "192.168.1.0/24"）；空的 [] = 改用密碼登入
allow_ips = []   # 只允許這些裝置的 IP（例如 "192.168.1.0/24"）；空的 = 改用密碼登入
# 網頁登入密碼 (加密後的雜湊值，不是明碼)。不要手動改，用這個指令設定或清除:
#   cd ~/hamster && .venv/bin/python set_password.py
# 空的 = 不用登入；登入時帳號隨便填
password_hash = ""

[camera]
rotation = 180            # 0 或 180 (硬體翻轉)

[tracker]
# 修改後執行: sudo systemctl restart hamster-tracker
width = 640
height = 480
fps = 15
process_scale = 0.5     # 偵測時先縮小影像，省 CPU
bg_history = 500        # 背景模型記憶的影格數 (越大越慢適應光線變化)
bg_threshold = 25       # 越大越不敏感
warmup_frames = 150     # 啟動後先學背景幾格 (約 10 秒，等自動曝光穩定)，不偵測
min_area = 0.002        # 移動物體至少佔畫面多少比例才算倉鼠 (濾掉木屑雜訊)
max_area = 0.25         # 超過這個比例當作開燈 / 相機被碰到，忽略
min_step_cm = 2.0       # 每秒位移小於這個值不算移動距離 (濾掉框框抖動)
max_speed_cm_s = 50     # 每秒位移超過這個值當作偵測跳到別的東西，不算距離
cage_w_cm = 30          # 籠底 1→2 點那條邊（畫面上方）的實際長度 (cm)
cage_h_cm = 50          # 籠底 2→3 點那條邊的實際長度 (cm)
# 偵測範圍：籠子在畫面中的輪廓 (含牆面)，座標 0~1，至少 3 點；空的 = 整個畫面
roi = [[0.7152, 0.0], [0.763, 0.0355], [0.794, 0.1136], [0.8157, 0.2091], [0.8894, 0.4168], [0.9548, 0.572], [0.9992, 0.6658], [1.0, 1.0], [0.0008, 1.0], [0.005, 0.7462], [0.0335, 0.6915], [0.0871, 0.6736], [0.1357, 0.6535], [0.1457, 0.596], [0.0988, 0.4844], [0.0561, 0.3571], [0.041, 0.2577], [0.0419, 0.1795], [0.0905, 0.1125], [0.1147, 0.0282], [0.1575, 0.0047], [0.1859, 0.0958], [0.2797, 0.1505], [0.325, 0.074], [0.3794, 0.0606], [0.3451, 0.0], [0.5536, 0.0]]
# 籠底四角 [左上, 右上, 右下, 左下]，座標 0~1；斜角架設時填，正上方可留空
floor = [[0.3141, 0.0695], [0.768, 0.0583], [1.0, 1.0], [0.1759, 1.0]]
# 行為區域（用網頁「框選籠子範圍 → 區域」畫）
zones = [{kind = "nest", poly = [[0.3635, 0.4419], [0.4045, 0.3403], [0.4732, 0.27], [0.5369, 0.251], [0.5821, 0.2744], [0.5771, 0.3638], [0.5176, 0.4062], [0.4481, 0.4229]]}, {kind = "wheel", poly = [[0.3551, 0.0], [0.3894, 0.0712], [0.4992, 0.1159], [0.5796, 0.1449], [0.6566, 0.1103], [0.7261, 0.0]]}, {kind = "food", poly = [[0.7228, 0.768], [0.7722, 0.7568], [0.8576, 0.7714], [0.9263, 0.816], [0.9673, 0.8853], [1.0, 1.0], [0.6374, 0.998], [0.6298, 0.9054], [0.6533, 0.8127]]}, {kind = "water", poly = [[0.2111, 0.4363], [0.2931, 0.4732], [0.3233, 0.5782], [0.3183, 0.7044], [0.2521, 0.7714], [0.1977, 0.6887], [0.1717, 0.5771]]}, {kind = "bath", poly = [[0.3685, 0.6552], [0.4338, 0.6664], [0.5101, 0.7825], [0.5251, 0.8875], [0.536, 1.0], [0.3794, 1.0], [0.0335, 1.0], [0.0729, 0.8272], [0.1307, 0.6932], [0.201, 0.6463], [0.3049, 0.6519]]}]
snapshot_interval_s = 2
stream_fps = 10         # 網頁即時影像的更新率 (有人在看時才會產生)
dataset_motion_interval_s = 30   # 有移動時每幾秒存一張訓練用照片
dataset_idle_interval_s = 600    # 沒移動時每幾秒存一張 (倉鼠可能在睡覺)
dataset_max = 3000               # 訓練照片上限
positions_keep_days = 30       # 每秒位置紀錄保留幾天 (每分鐘活動量會一直保留)
# AI 辨識（詳見 YOLO_GUIDE.md）
detector = "hybrid"      # motion = 動態偵測；hybrid = AI 找位置 + 動態判斷活動（有模型後建議）；yolo = 只用 AI
yolo_model = "models/hamster_model"
yolo_imgsz = 320
yolo_conf = 0.45         # 信心門檻：誤認太多就調高，常常找不到就調低
head_conf = 0.25         # 頭的信心門檻（0.35 → 0.25：2026-11-20 實測多找到約 10% 的頭，框錯很少）
yolo_interval_s = 0.5    # 每幾秒辨識一次
prelabel = true          # 存照片時一起存預先畫好的框，標記時只要修正

[alerts]
# 手機通知 (ntfy)：手機裝 ntfy App，訂閱下面的 topic 就會收到通知。修改後不用重啟，30 秒內生效
# topic 等於頻道密碼，知道的人都能收到通知，不要公開
enabled = true
ntfy_server = "https://ntfy.sh"
topic = ""   # 自己的 ntfy topic（等於頻道密碼，不要公開）
check_interval_s = 30
temp_high = 30.0        # 溫度 >= 這個值持續 hold_minutes 就通知 (降到低 1°C 才算恢復)
temp_low = 15.0         # 溫度 <= 這個值持續 hold_minutes 就通知
hum_high = 75           # 濕度 >= 這個值持續 10 分鐘就通知
hold_minutes = 5        # 狀況要持續多久才通知，避免短暫波動就吵你
repeat_minutes = 120    # 狀況一直沒改善，每隔多久再提醒一次
inactive_hours = 18     # 倉鼠超過幾小時沒偵測到活動就通知 (0 = 不檢查)
daily_summary = "09:00" # 每天這個時間傳昨天的摘要；空字串 "" = 不傳

[heartbeat]
# 斷線監控 (healthchecks.io)；用 set_heartbeat.py 設定
url = ""   # 用 set_heartbeat.py 設定
